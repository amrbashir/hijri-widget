<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans)}main{max-width:440px;margin:auto;padding-bottom:78px}button,input{font:inherit;color:inherit}button{cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;margin:12px 0}h2{margin:0;font-size:20px}.reset{border:0;background:transparent;padding:8px;color:var(--primary)}.preview{height:150px;border-radius:22px;background:var(--secondary);position:relative;margin-bottom:20px;overflow:hidden}.widget{position:absolute;inset:12px 25px;border-radius:16px;background:var(--card);border:1px solid var(--border)}.date{position:absolute;padding:6px;font-size:22px;line-height:1.35;white-space:pre-line;border:1px dashed color-mix(in srgb,var(--primary) 65%,transparent);background:color-mix(in srgb,var(--primary) 6%,transparent);overflow:hidden}.heading{font-size:15px;font-weight:600;margin-bottom:6px}.description,.hint,.state{font-size:12px;color:var(--muted-foreground);line-height:1.5}.description{margin-bottom:14px}.panel{background:var(--card);border-radius:var(--radius);padding:20px 16px}.spatial{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;align-items:center}.top{grid-area:1/2}.start{grid-area:2/1}.middle{grid-area:2/2}.end{grid-area:2/3}.bottom{grid-area:3/2}.control{min-width:0;position:relative}.control input{width:100%;min-width:0;border:0;background:none;text-align:center;font-size:26px;padding:7px 0;outline:none;font-variant-numeric:tabular-nums}.label{font-size:12px;color:var(--muted-foreground)}.diagram{border:1px dashed var(--border);border-radius:12px;height:84px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted-foreground);font-size:12px;line-height:1.5}.a .control{border:1px solid var(--border);border-radius:12px;padding:10px 8px 6px}.a .label{position:absolute;top:-9px;left:10px;padding:0 5px;background:var(--card)}.a .control:focus-within{border:2px solid var(--primary);padding:9px 7px 5px}.a .control:focus-within .label{color:var(--primary)}.b .control{border-radius:12px 12px 0 0;background:var(--secondary);padding:10px 8px 3px;border-bottom:2px solid var(--border)}.b .control:focus-within{border-bottom-color:var(--primary)}.b .label{display:block;text-align:center}.b .diagram{border:0;background:color-mix(in srgb,var(--primary) 8%,var(--card));border-radius:12px}.c .label{display:block;text-align:center;margin-bottom:8px}.c .well{background:var(--secondary);border-radius:12px;overflow:hidden}.c input{padding:8px 0 4px;font-size:24px}.steps{display:flex;border-top:1px solid var(--border)}.steps button{width:50%;border:0;background:transparent;color:var(--primary);height:30px;font-size:19px}.steps button+button{border-left:1px solid var(--border)}.c .diagram{height:96px;border-style:solid}.hint{margin-top:18px}.state{text-align:center;margin-top:13px;font-variant-numeric:tabular-nums}.switch{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;background:var(--popover);border:1px solid var(--border);padding:5px;border-radius:30px;box-shadow:0 5px 20px #0004;gap:3px;white-space:nowrap}.switch button{width:34px;height:34px;background:transparent;border:0;border-radius:50%}.switch .active{background:var(--primary);color:var(--primary-foreground)}button:focus-visible{outline:2px solid var(--ring)}
</style></head><body><!-- Throwaway styles for the selected spatial padding layout. Switch ?variant=A/B/C. No persistence. --><main><header><h2>Padding <span style="font-size:13px;color:var(--muted-foreground);font-weight:400">(dp)</span></h2><button class="reset" onclick="reset()">Reset</button></header><div class="preview"><div class="widget"><div id="date" class="date">28 Jumada I
1448</div></div></div><div id="title" class="heading"></div><div id="description" class="description"></div><div class="panel" id="panel"><div class="spatial" id="grid"></div><div class="hint">Start and end follow the device language.</div></div><div id="state" class="state"></div></main><nav class="switch" aria-label="Style variants"><button aria-label="Previous" onclick="cycle(-1)">‹</button><span id="choices"></span><button aria-label="Next" onclick="cycle(1)">›</button></nav><script>
const keys=['top','start','end','bottom'], labels={top:'Top',start:'Start',end:'End',bottom:'Bottom'},p={top:8,start:12,end:12,bottom:8};const variants=['A','B','C'];let v=new URLSearchParams(location.search).get('variant')||'A';if(!variants.includes(v))v='A';
const names={A:'Outlined fields',B:'Filled fields',C:'Compact steppers'},desc={A:'Floating labels and a clear focus outline, close to the current app.',B:'Inset labels and an underline, with a softer surface around each value.',C:'Visible minus and plus actions for precise changes without a keyboard.'};
function field(k){let input='<input type="number" inputmode="numeric" min="0" max="48" aria-label="'+labels[k]+' padding" data-key="'+k+'" value="'+p[k]+'" oninput="setValue(\''+k+'\',this.value)">';return '<label class="control '+k+'"><span class="label">'+labels[k]+'</span>'+(v==='C'?'<div class="well">'+input+'<div class="steps"><button type="button" aria-label="Decrease '+k+'" onclick="event.preventDefault();setValue(\''+k+'\',p.'+k+'-1)">−</button><button type="button" aria-label="Increase '+k+'" onclick="event.preventDefault();setValue(\''+k+'\',p.'+k+'+1)">+</button></div></div>':input)+'</label>';}
function setValue(k,n){p[k]=Math.max(0,Math.min(48,Number(n)||0));update();}
function update(){document.getElementById('date').style.inset=p.top+'px '+p.end+'px '+p.bottom+'px '+p.start+'px';document.getElementById('state').textContent=keys.map(k=>labels[k]+' '+p[k]).join(' · ')+' dp';document.querySelectorAll('input').forEach(el=>{if(el!==document.activeElement)el.value=p[el.dataset.key]});}
function draw(){document.getElementById('title').textContent=v+' · '+names[v];document.getElementById('description').textContent=desc[v];document.getElementById('panel').className='panel '+v.toLowerCase();document.getElementById('grid').innerHTML=keys.map(field).join('')+'<div class="middle diagram">Date<br>content</div>';document.getElementById('choices').innerHTML=variants.map(k=>'<button class="'+(k===v?'active':'')+'" onclick="choose(\''+k+'\')">'+k+'</button>').join('');update();}
function choose(k){v=k;try{const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u)}catch{}draw()}
function cycle(n){choose(variants[(variants.indexOf(v)+n+3)%3])}function reset(){keys.forEach(k=>p[k]=0);draw()}document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});draw();
</script></body></html>

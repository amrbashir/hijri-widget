<!doctype html>
<!-- THROWAWAY UI prototype: three alternatives, ?variant=A/B/C. No persistence.
Run from repo root: python3 -m http.server 8765
Question: which model makes multilingual, multiline date editing clearest?
No winner yet; archive to a prototype branch after choosing. -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date editor alternatives</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:var(--foreground,#eee)}button,input,select{font:inherit;color:inherit;background:#353540;border:1px solid #66616f;border-radius:8px;padding:8px;cursor:pointer}button:hover{background:#514765}input{cursor:text;min-width:0}p{line-height:1.6}h2{font-size:19px;margin:0 0 8px}h3{font-size:14px;margin:10px 0}.intro{color:var(--muted-foreground,#aaa);font-size:12px}.workspace{display:grid;grid-template-columns:minmax(0,400px) minmax(180px,1fr);gap:20px;align-items:start}.phone{background:#191a22;color:#eee9f5;border-radius:24px;padding:20px;min-height:560px}.header{font-size:19px;display:flex;justify-content:space-between;margin-bottom:20px}.preview{white-space:pre-wrap;background:#050507;border-radius:18px;padding:25px 12px;font-size:28px;text-align:center;line-height:1.7;margin-bottom:16px;overflow-wrap:anywhere}.card{background:#292933;border-radius:17px;padding:15px;margin-top:12px}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.hint,small{color:#bcb6ca;font-size:12px}.active{background:#514565!important;border-color:#d1b8ff!important}.token{background:none;border:0;border-bottom:2px dashed #706377;font-size:27px;padding:0 2px;border-radius:3px}.slot{background:none;border:0;color:#bfa7ed;font-size:17px;padding:0 2px}.entry{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #5b5364;border-radius:8px;margin:6px 0;cursor:pointer}.entry small{display:block}.entry span:last-child{margin-left:auto}.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:12px;display:flex;flex-direction:column;gap:5px}select{min-width:0;width:100%}.recipe{border-left:3px solid #bda0e2;padding-left:12px;margin:18px 0}.field{display:grid;grid-template-columns:1fr 1fr 30px;gap:5px;margin:8px 0}.rowhead{display:flex;justify-content:space-between;align-items:center}.notes p{color:var(--muted-foreground,#aaa)}pre{white-space:pre-wrap;word-break:break-word;font:11px ui-monospace,monospace;padding:12px;border-radius:8px;background:var(--muted,#25252c)}details{margin:15px 0}summary{cursor:pointer}.switcher{position:sticky;bottom:15px;margin:0 auto;width:fit-content;background:#eee5ff;color:#22132d;padding:6px;border-radius:35px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 24px #0006;white-space:nowrap}.switcher button{background:transparent;border:0;color:inherit}.switcher span{min-width:170px;text-align:center;font-weight:600}.spacer{height:90px}@media(max-width:560px){.workspace{grid-template-columns:1fr}.phone{min-height:0}}
</style>
<p class="intro">THROWAWAY PROTOTYPE · Three alternatives to the chip editor · In-memory changes only</p>
<div class="workspace"><main class="phone"><div class="header"><span>‹ &nbsp; Date format</span><span>✓</span></div><div id="editor"></div></main><aside class="notes"><div id="description"></div><details open><summary>Generated pattern</summary><pre id="pattern"></pre></details><details><summary>Full state</summary><pre id="state"></pre></details><button onclick="reset()">Reset this approach</button></aside></div><div class="spacer"></div><nav class="switcher"><button onclick="cycle(-1)" aria-label="Previous approach">←</button><span id="name"></span><button onclick="cycle(1)" aria-label="Next approach">→</button></nav>
<script>
const names={A:'Edit the date',B:'Format outline',C:'Row recipes'}, types={d:'Day',M:'Month',y:'Year',E:'Weekday',text:'Text',br:'New line'},langs={device:'Device language',ar:'Arabic',en:'English',tr:'Turkish'},styles={d:['d','dd'],M:['M','MM','MMM','MMMM'],y:['yy','yyyy'],E:['EEE','EEEE']};
const notes={A:['Edit the rendered date','Tap a value to edit its style or language. Tap + between values to insert exactly there. New lines split the canvas.','Direct and visual; insertion marks become busy in long formats.'],B:['A vertical format outline','Every field, separator, and line break has an entry. Select one to edit; move it with arrows. New parts insert after the selection.','Precise and accessible; needs more vertical scrolling.'],C:['Guided recipes for rows','Choose fields, styles, and languages in a form. Set a shared separator for each row. Add or move entire rows.','Easy for regular layouts; each row deliberately uses a single separator.']};
const field=(type='y')=>({type,style:{d:'d',M:'MMMM',y:'yyyy',E:'EEEE'}[type],lang:'device'}),initial=()=>[field('d'),{type:'text',text:' '},field('M'),{type:'text',text:' '},field('y')];
const models={A:initial(),B:initial(),C:[{separator:' ',fields:[field('d'),field('M'),field('y')]}]};let v=new URLSearchParams(location.search).get('variant')||'A';if(!names[v])v='A';let sel={A:2,B:2},at=null;
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
function value(p){if(p.type==='br')return '\n';if(p.type==='text')return p.text;const opts={d:{day:p.style==='dd'?'2-digit':'numeric'},M:{month:{M:'numeric',MM:'2-digit',MMM:'short',MMMM:'long'}[p.style]},y:{year:p.style==='yy'?'2-digit':'numeric'},E:{weekday:p.style==='EEE'?'short':'long'}};return new Intl.DateTimeFormat((p.lang==='device'?'en-GB':p.lang)+'-u-ca-islamic-umalqura',{...opts[p.type],timeZone:'UTC'}).format(new Date('2026-10-26T12:00:00Z')).replace(/ AH| هـ/g,'')}
function flat(){return v==='C'?models.C.flatMap((r,i)=>[...(i?[{type:'br'}]:[]),...r.fields.flatMap((p,j)=>[...(j?[{type:'text',text:r.separator}]:[]),p])]):models[v]}
function pattern(){return flat().map(p=>p.type==='br'?'\n':p.type==='text'?(/[a-zA-Z'{}]/.test(p.text)?"'"+p.text.replaceAll("'","''")+"'":p.text):p.lang==='device'?p.style:({ar:'ar-SA',en:'en-GB',tr:'tr-TR'}[p.lang]+'{'+p.style+'}')).join('')}
function options(obj,current){return Object.entries(obj).map(([k,n])=>'<option value="'+esc(k)+'" '+(k===current?'selected':'')+'>'+esc(n)+'</option>').join('')}
function palette(){return '<div class="actions">'+Object.entries(types).map(([k,n])=>'<button onclick="add(\''+k+'\')">+ '+(k==='text'?'␣ / text':n)+'</button>').join('')+'</div>'}
function inspector(){let p=models[v][sel[v]];if(!p)return '';return '<h3>'+types[p.type]+' settings</h3>'+(p.type==='br'?'<p class="hint">Start a new row here.</p>':p.type==='text'?'<label>Literal text<input value="'+esc(p.text)+'" onchange="edit(\'text\',this.value)"></label>':'<div class="settings"><label>Style<select onchange="edit(\'style\',this.value)">'+options(Object.fromEntries(styles[p.type].map(s=>[s,s+' · '+value({...p,style:s})])),p.style)+'</select></label><label>Language<select onchange="edit(\'lang\',this.value)">'+options(langs,p.lang)+'</select></label></div>')+'<div class="actions"><button onclick="move(-1)">← Earlier</button><button onclick="move(1)">Later →</button><button onclick="remove()">Remove</button></div>'}
function render(){let a=flat(),html='',n=notes[v];document.querySelector('#name').textContent=v+' · '+names[v];document.querySelector('#description').innerHTML='<h2>'+n[0]+'</h2><p>'+n[1]+'</p><p>'+n[2]+'</p><p class="hint">Sample: 26 October 2026. Device language: English. Preview uses the browser’s Umm al-Qura calendar.</p>';
if(v==='A'){html='<div class="preview">'+a.map((p,i)=>'<button class="slot" aria-label="Insert before part '+(i+1)+'" onclick="at='+i+';render()">+</button><button class="token '+(sel.A===i?'active':'')+'" onclick="choose('+i+')">'+esc(p.type==='br'?'↵':p.type==='text'&&p.text===' '?'␣':value(p))+'</button>'+(p.type==='br'?'<br>':'')).join('')+'<button class="slot" onclick="at='+a.length+';render()">+</button></div><div class="card"><h2>'+(at===null?'Edit selected value':'Insert at position '+(at+1))+'</h2>'+(at===null?inspector():palette())+'</div>'}
if(v==='B'){html='<div class="preview">'+esc(a.map(value).join(''))+'</div><div class="card"><h2>Format outline</h2>'+a.map((p,i)=>'<div class="entry '+(sel.B===i?'active':'')+'" onclick="choose('+i+')"><span>'+(i+1)+'</span><div>'+types[p.type]+'<small>'+esc(p.type==='br'?'Start next row':p.type==='text'?(p.text===' '?'␣ Space':p.text):value(p)+' · '+langs[p.lang])+'</small></div><span>›</span></div>').join('')+inspector()+'<p class="hint">Insert after selected entry</p>'+palette()+'</div>'}
if(v==='C'){html='<div class="preview">'+esc(a.map(value).join(''))+'</div><div class="card"><h2>Rows</h2>'+models.C.map((r,ri)=>'<div class="recipe"><div class="rowhead"><h3>Row '+(ri+1)+'</h3><div><button onclick="rowMove('+ri+')" aria-label="Move row up">↑</button> <button onclick="models.C.splice('+ri+',1);render()" aria-label="Remove row">×</button></div></div>'+r.fields.map((p,fi)=>'<div class="field"><select aria-label="Field" onchange="set('+ri+','+fi+',\'type\',this.value)">'+options({d:'Day',M:'Month',y:'Year',E:'Weekday'},p.type)+'</select><select aria-label="Language" onchange="set('+ri+','+fi+',\'lang\',this.value)">'+options(langs,p.lang)+'</select><button onclick="models.C['+ri+'].fields.splice('+fi+',1);render()" aria-label="Remove field">×</button><select style="grid-column:1/3" aria-label="Style" onchange="set('+ri+','+fi+',\'style\',this.value)">'+options(Object.fromEntries(styles[p.type].map(s=>[s,s+' · '+value({...p,style:s})])),p.style)+'</select><button onclick="fieldMove('+ri+','+fi+')" aria-label="Move field earlier">←</button></div>').join('')+'<div class="actions"><button onclick="models.C['+ri+'].fields.push(field());render()">+ Field</button><label>Between fields<select onchange="models.C['+ri+'].separator=this.value;render()">'+options({' ':'␣ Space',' / ':'/ Slash',' - ':'- Dash',', ':', Comma','':'None'},r.separator)+'</select></label></div></div>').join('')+'<button onclick="models.C.push({separator:\' \',fields:[field(\'d\')]});render()">+ Add row</button></div>'}
document.querySelector('#editor').innerHTML=html;document.querySelector('#pattern').textContent=pattern();document.querySelector('#state').textContent=JSON.stringify({variant:v,selection:sel[v],insertion:at,parts:models[v]},null,2);console.log('State',v,JSON.stringify(models[v]))}
function choose(i){sel[v]=i;at=null;render()}function edit(k,x){models[v][sel[v]][k]=x;render()}function add(t){let i=at??((sel[v]??-1)+1);models[v].splice(i,0,t==='br'?{type:t}:t==='text'?{type:t,text:' '}:field(t));sel[v]=i;at=null;render()}function move(d){let a=models[v],i=sel[v],j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];sel[v]=j;render()}function remove(){models[v].splice(sel[v],1);sel[v]=Math.max(0,sel[v]-1);render()}function set(r,f,k,x){let p=models.C[r].fields[f];p[k]=x;if(k==='type')p.style=field(x).style;render()}function rowMove(r){if(r){let a=models.C;[a[r-1],a[r]]=[a[r],a[r-1]];render()}}function fieldMove(r,f){if(f){let a=models.C[r].fields;[a[f-1],a[f]]=[a[f],a[f-1]];render()}}function reset(){models[v]=v==='C'?[{separator:' ',fields:[field('d'),field('M'),field('y')]}]:initial();sel[v]=2;at=null;render()}
function cycle(d){v=['A','B','C'][(['A','B','C'].indexOf(v)+d+3)%3];at=null;try{let u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u)}catch(e){}render()}document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]'))return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});render();
</script></html>

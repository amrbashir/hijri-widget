<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);color:var(--foreground)}button,input{font:inherit}button{cursor:pointer;color:inherit}main{max-width:430px;margin:auto;padding-bottom:84px}h2{font-size:22px;margin:0}header{display:flex;align-items:center;justify-content:space-between;margin:14px 0}.quiet{border:0;background:none;color:var(--primary);padding:8px}.muted{color:var(--muted-foreground);font-size:13px}.preview{height:164px;background:var(--secondary);border-radius:22px;position:relative;overflow:hidden;margin:16px 0}.widget{position:absolute;inset:12px 24px;background:var(--card);border:1px solid var(--border);border-radius:16px}.content{position:absolute;border:1px dashed color-mix(in srgb,var(--primary) 65%,transparent);background:color-mix(in srgb,var(--primary) 8%,transparent);padding:6px;white-space:pre-line;font-size:23px;line-height:1.3;overflow:hidden}.intro{margin-bottom:14px}.panel{background:var(--card);padding:16px;border-radius:var(--radius)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.sliderrow{padding:10px 0}.sliderrow+ .sliderrow{border-top:1px solid var(--border)}input[type=range]{width:100%;accent-color:var(--primary);margin:12px 0 4px;height:22px}input[type=number]{width:100%;background:transparent;border:0;outline:0;color:var(--foreground);font-size:25px;min-width:0;padding:6px 0}input:focus{outline:2px solid var(--primary);outline-offset:3px;border-radius:4px}.badge{font-variant-numeric:tabular-nums;color:var(--primary);font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{border:1px solid var(--border);border-radius:12px;padding:12px}.field:focus-within{border-color:var(--primary)}.unit{font-size:13px;color:var(--muted-foreground)}.state{font-size:12px;color:var(--muted-foreground);text-align:center;margin:14px 0 6px;font-variant-numeric:tabular-nums}.spatial{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:center}.spatial .field{text-align:center;padding:8px}.spatial input{text-align:center;font-size:22px}.mini{border:1px dashed var(--border);padding:18px 2px;text-align:center;font-size:12px;color:var(--muted-foreground);border-radius:8px}.tabgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab{border:1px solid var(--border);background:transparent;border-radius:12px;padding:13px;text-align:left;display:flex;justify-content:space-between}.tab.active{background:var(--secondary);border-color:var(--primary);color:var(--primary)}.stepper{display:flex;align-items:center;background:var(--secondary);border-radius:10px;overflow:hidden}.stepper button{background:transparent;border:0;width:42px;height:42px;font-size:23px;color:var(--primary)}.stepper input{width:45px;text-align:center;font-size:18px;padding:0}.step{padding:10px 0}.step+.step{border-top:1px solid var(--border)}.presets{display:flex;gap:8px;margin-top:14px}.presets button{flex:1;border:1px solid var(--border);border-radius:8px;background:transparent;padding:9px;font-size:13px}.switcher{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);width:max-content;max-width:95%;display:flex;align-items:center;gap:3px;padding:6px;background:var(--popover);border:1px solid var(--border);border-radius:30px;box-shadow:0 5px 20px #0005}.switcher button{border:0;background:none;border-radius:50%;width:34px;height:34px}.switcher button.active{background:var(--primary);color:var(--primary-foreground)}.caption{font-size:12px;text-align:center;margin-top:10px;color:var(--muted-foreground)}button:focus-visible{outline:2px solid var(--ring)}
</style></head><body><!-- Throwaway: five four-side padding controls for Layout settings, ?variant=A..E. State is in memory only. -->
<main><header><h2>Padding</h2><button class="quiet" onclick="reset()">Reset</button></header><div class="preview"><div class="widget"><div class="content" id="content">28 Jumada I
1448</div></div></div><div class="intro"><strong id="name"></strong><div class="muted" id="description" style="margin-top:5px"></div></div><section id="controls"></section><div id="state" class="state"></div><div class="caption">All values in dp. Start and end follow the device language.</div></main>
<nav class="switcher" aria-label="Prototype variants"><button onclick="cycle(-1)" aria-label="Previous variant">‹</button><span id="switchbuttons"></span><button onclick="cycle(1)" aria-label="Next variant">›</button></nav>
<script>
const variants=['A','B','C','D','E'], names=['Four sliders','Compact numeric grid','Around the content','Choose a side','Inline steppers'];
const descriptions=['All four controls visible for quick visual adjustment.','Four direct inputs with a smaller footprint.','Place each input on the edge it controls.','Select a side, then adjust it with one shared slider.','Precise one-step changes, with quick values for all sides.'];
const keys=['start','top','end','bottom'],labels={start:'Start',top:'Top',end:'End',bottom:'Bottom'};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants.includes(variant))variant='A';let side='top';const p={start:12,top:8,end:12,bottom:8};
const input=(k)=>'<input type="number" min="0" max="48" aria-label="'+labels[k]+' padding" value="'+p[k]+'" oninput="setValue(\''+k+'\',this.value)">';
const field=(k)=>'<label class="field"><span class="muted">'+labels[k]+'</span><div class="row">'+input(k)+'<span class="unit">dp</span></div></label>';
const slider=(k)=>'<div class="sliderrow"><div class="row"><label for="range-'+k+'">'+labels[k]+'</label><span class="badge" data-value="'+k+'">'+p[k]+' dp</span></div><input id="range-'+k+'" type="range" min="0" max="48" value="'+p[k]+'" oninput="setValue(\''+k+'\',this.value)"></div>';
function setValue(k,value){p[k]=Math.max(0,Math.min(48,Number(value)||0));update();}
function update(){document.getElementById('content').style.inset=p.top+'px '+p.end+'px '+p.bottom+'px '+p.start+'px';document.getElementById('state').textContent=keys.map(k=>labels[k]+' '+p[k]).join(' · ')+' dp';document.querySelectorAll('[data-value]').forEach(el=>el.textContent=p[el.dataset.value]+' dp');document.querySelectorAll('input').forEach(el=>{const key=keys.find(k=>el.getAttribute('aria-label')===labels[k]+' padding')||el.id.replace('range-','');if(keys.includes(key)&&document.activeElement!==el)el.value=p[key];});}
function draw(){const i=variants.indexOf(variant);document.getElementById('name').textContent=variant+' · '+names[i];document.getElementById('description').textContent=descriptions[i];let markup='';
if(variant==='A')markup='<div class="panel">'+keys.map(slider).join('')+'</div>';
if(variant==='B')markup='<div class="grid">'+keys.map(field).join('')+'</div>';
if(variant==='C')markup='<div class="panel spatial"><div></div>'+field('top')+'<div></div>'+field('start')+'<div class="mini">Date<br>content</div>'+field('end')+'<div></div>'+field('bottom')+'<div></div></div>';
if(variant==='D')markup='<div class="panel"><div class="tabgrid">'+keys.map(k=>'<button class="tab '+(side===k?'active':'')+'" onclick="side=\''+k+'\';draw()">'+labels[k]+'<span data-value="'+k+'">'+p[k]+' dp</span></button>').join('')+'</div><div style="margin-top:16px">'+slider(side)+'</div></div>';
if(variant==='E')markup='<div class="panel">'+keys.map(k=>'<div class="row step"><span>'+labels[k]+'</span><div class="stepper"><button aria-label="Decrease '+k+'" onclick="setValue(\''+k+'\',p.'+k+'-1)">−</button>'+input(k)+'<button aria-label="Increase '+k+'" onclick="setValue(\''+k+'\',p.'+k+'+1)">+</button></div></div>').join('')+'<div class="presets">'+[0,8,16,24].map(v=>'<button onclick="keys.forEach(k=>p[k]='+v+');draw()">All '+v+'</button>').join('')+'</div></div>';
document.getElementById('controls').innerHTML=markup;document.getElementById('switchbuttons').innerHTML=variants.map(v=>'<button class="'+(variant===v?'active':'')+'" onclick="choose(\''+v+'\')">'+v+'</button>').join('');update();}
function choose(v){variant=v;try{const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);}catch{}draw();}
function cycle(d){choose(variants[(variants.indexOf(variant)+d+5)%5]);}
function reset(){keys.forEach(k=>p[k]=0);draw();}
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1);});draw();
</script></body></html>

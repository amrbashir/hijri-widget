<!doctype html>
<!-- THROWAWAY: Three Add part pickers in the existing date editor context.
Question: which picker makes insertion fast and understandable? No decision yet.
Run from repo root: python3 -m http.server 8765
Open this file's path with ?variant=A, B, or C. No persistence or Android mutations. -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add part — prototype alternatives</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:var(--foreground,#eee)}button,input{font:inherit;cursor:pointer;color:inherit}button{border:0;background:none}button:focus-visible{outline:2px solid #c7b5f3;outline-offset:2px}p{line-height:1.6}.intro{font-size:12px;color:var(--muted-foreground,#aaa);margin:0 0 14px}.workspace{display:grid;grid-template-columns:minmax(0,390px) minmax(180px,1fr);gap:22px;align-items:start}.phone{position:relative;isolation:isolate;overflow:hidden;background:#191a22;color:#e9e5f0;border-radius:24px;min-height:650px;padding:20px}.header{font-size:19px;margin:0 0 22px}.widget{background:linear-gradient(150deg,#9da6c3,#313a50 65%,#15151c);padding:26px 10px;text-align:center;border-radius:18px;font-size:30px;margin-bottom:24px;white-space:pre-wrap}.custom{background:#282832;border-radius:18px;padding:18px}.custom h3{margin:0 0 18px;font-size:17px}.canvas{background:#050507;padding:18px 10px;border-radius:15px;line-height:2;font-size:22px;white-space:pre-wrap;overflow-wrap:anywhere}.value{font-size:inherit;border-bottom:1px dashed #897793;padding:0 2px}.value.selected{background:#51445f;border-bottom:2px solid #c6adeb}.plus{color:#c5b4ec;font-size:22px;padding:0 3px}.hint{font-size:12px;color:#bdb6cb}.scrim{position:absolute;inset:0;background:#0009;z-index:1;display:flex;align-items:center;justify-content:center;padding:20px}.dialog{background:#25242d;border-radius:24px;padding:22px;width:100%;box-shadow:0 12px 40px #0005}.dialog h2{font-size:22px;font-weight:500;margin:0 0 7px}.dialog p{margin:0 0 14px}.list{display:flex;flex-direction:column;gap:2px}.item{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:10px 0;border-radius:9px}.item:hover,.tile:hover,.quick button:hover{background:#403849}.glyph{color:#cbb7ed;display:flex;align-items:center;justify-content:center;font-size:20px;min-width:36px;height:36px;background:#36303f;border-radius:10px}.item strong{display:block;font-weight:500}.item small{display:block;color:#b8b0c2;margin-top:3px}.sample{margin-left:auto;color:#cbb7ed;font-size:16px;white-space:nowrap}.cancel{display:block;margin:12px 0 -5px auto;padding:10px;color:#cbb7ed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile{background:#302c38;border:1px solid #4e455c;border-radius:13px;text-align:left;padding:14px;min-height:91px}.tile .example{font-size:23px;color:#d3bdf3;margin-bottom:7px;display:block}.tile small{color:#b9afc9}.sheet.scrim{align-items:flex-end;padding:0}.sheet .dialog{border-radius:25px 25px 0 0;padding:18px 22px 24px}.handle{height:4px;width:35px;background:#817587;border-radius:8px;margin:0 auto 18px}.sheethead{display:flex;justify-content:space-between;align-items:center}.close{font-size:25px;color:#c9b6e3;padding:5px}.fieldlist{display:grid;grid-template-columns:1fr;gap:0}.fieldlist .item{padding:9px 0}.divider{border-top:1px solid #4b424e;padding-top:14px;margin-top:10px}.quick{display:flex;gap:7px;flex-wrap:wrap}.quick button{border:1px solid #62526f;border-radius:9px;padding:10px 14px;color:#d1b8ee;font-size:18px}.textrow{display:flex;gap:7px;margin-top:12px}.textrow input{width:100%;min-width:0;border:1px solid #6b5c79;background:#1c1b23;border-radius:8px;padding:10px;cursor:text}.textrow button{background:#cbb5ee;color:#271a36;border-radius:9px;padding:8px 12px}.reopen{margin-top:16px;border:1px solid #b7a1d0;border-radius:10px;padding:10px;color:#d0b8ef}.notes h2{font-size:20px;margin-top:0}.notes p{color:var(--muted-foreground,#aaa)}pre{white-space:pre-wrap;word-break:break-word;font:11px ui-monospace,monospace;background:var(--muted,#24242c);border-radius:8px;padding:12px}summary{cursor:pointer}details{margin:16px 0}.reset{padding:9px;border:1px solid var(--border,#555);border-radius:8px}.switcher{position:sticky;bottom:16px;margin:25px auto 0;width:fit-content;display:flex;align-items:center;gap:10px;background:#eee4ff;color:#261a36;border-radius:35px;padding:7px;box-shadow:0 4px 25px #0005;z-index:3;white-space:nowrap}.switcher button{color:inherit;padding:8px 10px}.switcher span{min-width:165px;text-align:center;font-weight:600}.foot{height:40px}@media(max-width:560px){.workspace{grid-template-columns:1fr}.phone{min-height:650px}}
</style>
<p class="intro">THROWAWAY PROTOTYPE · Add part picker · In-memory changes only</p>
<div class="workspace"><main class="phone" id="phone"></main><aside class="notes"><div id="notes"></div><details open><summary>Generated pattern</summary><pre id="pattern"></pre></details><details><summary>Full state</summary><pre id="state"></pre></details><button class="reset" onclick="reset()">Reset this approach</button></aside></div><nav class="switcher"><button onclick="cycle(-1)" aria-label="Previous approach">←</button><span id="name"></span><button onclick="cycle(1)" aria-label="Next approach">→</button></nav><div class="foot"></div>
<script>
const names={A:'Compact list',B:'Visual tiles',C:'Quick insert sheet'};
const notes={A:['Compact list with examples','A single scan down the list. Each row names the component and shows an example; separators and newlines stay alongside fields. One tap inserts and closes.','Familiar, compact, and easy to scan. More text than the other choices.'],B:['Choose by rendered example','A two-column grid puts the output first. Each tile pairs an example with its component name. One tap inserts and closes.','Six choices fit in a short dialog. Tile order is less linear than a list.'],C:['Fields + ready-to-use separators','A bottom sheet separates date fields from layout controls. Insert a space, slash, dash, or line break directly, or type custom text before inserting.','Fewer steps for separators and custom text. More controls on the screen.']};
const choices=[['d','Day','Day of the month','15'],['M','Month','Name or number','Jumada I'],['y','Year','Hijri year','1448'],['E','Weekday','Day of the week','Monday'],['text','Separator or text','Space or literal text','␣'],['br','New line','Start another row','↵']];
const init=()=>[{type:'d',value:'15',pattern:'d'},{type:'text',value:' ',pattern:' '},{type:'M',value:'Jumada I',pattern:'MMMM'},{type:'text',value:' ',pattern:' '},{type:'y',value:'1448',pattern:'yyyy'}];
const models={A:init(),B:init(),C:init()};let v=new URLSearchParams(location.search).get('variant')||'A';if(!names[v])v='A';let open=true,position=2,selected=2,last=null,custom='';
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
function pattern(){return models[v].map(p=>p.type==='text'&&/[a-zA-Z'{}]/.test(p.value)?"'"+p.value.replaceAll("'","''")+"'":p.pattern).join('')}
function row(c){return '<button class="item" onclick="add(\''+c[0]+'\')"><span class="glyph">'+({d:'d',M:'M',y:'y',E:'E',text:'␣',br:'↵'}[c[0]])+'</span><span><strong>'+c[1]+'</strong><small>'+c[2]+'</small></span><span class="sample">'+c[3]+'</span></button>'}
function VariantA(){return '<div class="scrim" onclick="dismiss()"><section class="dialog" role="dialog" aria-label="Add part" onclick="event.stopPropagation()"><h2>Add part</h2><p class="hint">Insert at the selected +</p><div class="list">'+choices.map(row).join('')+'</div><button class="cancel" onclick="dismiss()">Cancel</button></section></div>'}
function VariantB(){return '<div class="scrim" onclick="dismiss()"><section class="dialog" role="dialog" aria-label="Add part" onclick="event.stopPropagation()"><h2>Add part</h2><p class="hint">What would you like to insert?</p><div class="grid">'+choices.map(c=>'<button class="tile" onclick="add(\''+c[0]+'\')"><span class="example">'+c[3]+'</span><span>'+c[1]+'</span></button>').join('')+'</div><button class="cancel" onclick="dismiss()">Cancel</button></section></div>'}
function VariantC(){return '<div class="scrim sheet" onclick="dismiss()"><section class="dialog" role="dialog" aria-label="Add part" onclick="event.stopPropagation()"><div class="handle"></div><div class="sheethead"><h2>Add part</h2><button class="close" onclick="dismiss()" aria-label="Close picker">×</button></div><p class="hint">Inserted at the selected +</p><div class="fieldlist">'+choices.slice(0,4).map(c=>'<button class="item" onclick="add(\''+c[0]+'\')"><strong>'+c[1]+'</strong><span class="sample">'+c[3]+' &nbsp; +</span></button>').join('')+'</div><div class="divider"><p class="hint">Separators & layout</p><div class="quick"><button onclick="add(\'text\',\' \')" aria-label="Insert space">␣</button><button onclick="add(\'text\',\'/\')" aria-label="Insert slash">/</button><button onclick="add(\'text\',\'-\')" aria-label="Insert dash">−</button><button onclick="add(\'br\')">↵ New line</button></div><div class="textrow"><input aria-label="Custom text" placeholder="Custom text" value="'+esc(custom)+'" oninput="custom=this.value;sync()"><button onclick="add(\'text\',custom)" '+(!custom?'disabled':'')+'>Insert</button></div></div></section></div>'}
function sync(){document.querySelector('#state').textContent=JSON.stringify({variant:v,open,insertion:position,selected,lastInserted:last,custom,parts:models[v]},null,2);const b=document.querySelector('.textrow button');if(b)b.disabled=!custom;console.log('Picker state',v,open,position,JSON.stringify(models[v]))}
function render(){
const n=notes[v];document.querySelector('#name').textContent=v+' · '+names[v];
document.querySelector('#notes').innerHTML='<h2>'+n[0]+'</h2><p>'+n[1]+'</p><p>'+n[2]+'</p><p>Try choosing a component, then tap a different + to reopen at another position. Cancel leaves the format unchanged.</p>';
document.querySelector('#phone').innerHTML='<div class="header">‹ &nbsp; Date format</div><div class="widget">'+esc(models[v].map(p=>p.value).join(''))+'</div><div class="custom"><h3>◉ &nbsp; Custom</h3><p class="hint">Tap a value to select it, or + to insert a component.</p><div class="canvas">'+models[v].map((p,i)=>'<button class="plus" onclick="show('+i+')" aria-label="Insert before part '+(i+1)+'">+</button><button class="value '+(selected===i?'selected':'')+'" onclick="selected='+i+';render()">'+esc(p.type==='br'?'↵':p.value===' '?'␣':p.value)+'</button>'+(p.type==='br'?'<br>':'')).join('')+'<button class="plus" onclick="show('+models[v].length+')" aria-label="Insert at end">+</button></div><button class="reopen" onclick="show(position)">Open Add part</button>'+(last?'<p class="hint">Inserted '+esc(last)+' · tap + to add another</p>':'')+'</div>'+(open?({A:VariantA,B:VariantB,C:VariantC}[v]()):'');
document.querySelector('#pattern').textContent=pattern();sync()}
function show(i){position=i;open=true;custom='';render()}
function dismiss(){open=false;custom='';render()}
function add(type,text){const c=choices.find(c=>c[0]===type);const value=type==='text'?(text??' '):type==='br'?'\n':c[3];const code=type==='text'?value:type==='br'?'\n':{d:'d',M:'MMMM',y:'yyyy',E:'EEEE'}[type];models[v].splice(position,0,{type,value,pattern:code});selected=position;last=c[1];position++;open=false;custom='';render()}
function reset(){models[v]=init();position=2;selected=2;last=null;custom='';open=true;render()}
function cycle(d){v=['A','B','C'][(['A','B','C'].indexOf(v)+d+3)%3];position=Math.min(2,models[v].length);selected=2;last=null;custom='';open=true;try{const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u)}catch(e){}render()}
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]'))return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}if(e.key==='Escape')dismiss()});render();
</script></html>
